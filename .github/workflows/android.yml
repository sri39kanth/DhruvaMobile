run-name: Android CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # a new push cancels the older run

jobs:
  checks_unit_tests:
    name: Check Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setting Up the Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
      - run: java --version
      - name: Setting Up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run the build
        run: ./gradlew testDebugUnitTest
  build_app:
    name: build App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setting Up the Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
      - run: java --version
      - name: Setting Up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run the build
        run: ./gradlew assembleDebug

  ktlint_check:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v7
      - name: Setting Up the Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
      - run: java --version
      - name: Setting Up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Ktlint check
        run: ./gradlew ktlintCheck

  detekt_lint:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Setting Up the Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
      - run: java --version
      - name: Setting Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run detekt
        run: ./gradlew detekt

      # Make sure we always run this upload task,
      # because the previous step may fail if there are findings.
      - name: Upload SARIF to GitHub using the upload-sarif action
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: app/build/reports/detekt/detekt.sarif

  android_lint:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Setting Up the Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
      - run: java --version
      - name: Setting Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run lint
        run: ./gradlew lint

      # Make sure we always run this upload task,
      # because the previous step may fail if there are findings.
      - name: Upload SARIF to GitHub using the upload-sarif action
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
  kover_coverage_report:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Setting Up the Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
      - run: java --version
      - name: Setting Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run kover coverage report
        run: ./gradlew koverXmlReportDebug koverVerifyDebug
  sonar_qube:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setting Up the Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
      - run: java --version
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Setting Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew koverXmlReportDebug sonar -Dsonar.qualitygate.wait=true


